name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore LuminUI.sln
      - run: dotnet build LuminUI.sln -c Release --no-restore
      - run: dotnet test LuminUI.sln -c Release --no-build
      - run: dotnet run -c Release --no-build --project benchmarks/LuminUI.Benchmarks
      - run: dotnet pack src/LuminUI/LuminUI.csproj -c Release --no-build --no-restore
